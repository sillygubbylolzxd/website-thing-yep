<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b2038">
<title>APG Cheat Sheet</title>
<meta name="description" content="Configure any command and copy it into the game!">
<link rel="icon" type="image/png" href="assets/crown2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header><img class="logo" src="assets/apg_text_icon.png" alt="aPG"><div><h1>all APG commands</h1><p>Pick a command, configure and copy it into the game.</p></div></header>
<div class="wrap">
<aside class="side"><input id="q" type="search" placeholder="Search commands" aria-label="Search commands"><div class="tabs" id="tabs"></div><div id="cmds"></div></aside>
<main id="panel"><p class="hint">Loading commands…</p></main>
</div>
<footer>
<p><small><code id="version">v1.19</code></small></p>
<p><small>Based on <a href="https://discord.com/users/205766199621976064">ow9u's</a> aPG vip commands cheat sheet. Made by <a href="https://discord.com/users/777172240927162429">TheCat</a></small></p>
</footer>
<div class="bar"><code id="out"></code><button id="cp">Copy</button><span class="tip">or press <kbd>Ctrl</kbd> <kbd>C</kbd></span></div>
<div class="toast" id="t" role="status"></div>
<script src="src/index.js"></script>
</body>
</html>
